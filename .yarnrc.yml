approvedGitRepositories:
  - "https://github.com/microsoft/react-native-test-app"

catalog:
  "@babel/core": ^7.20.0
  "@babel/helper-plugin-utils": ^7.0.0
  "@babel/preset-env": ^7.20.0
  "@babel/runtime": ^7.20.0
  "@microsoft/eslint-plugin-sdl": ^1.0.0
  "@octokit/core": ^7.0.0
  "@octokit/plugin-rest-endpoint-methods": ^17.0.0
  "@react-native-community/cli-types": ^20.1.0
  "@react-native/eslint-plugin": ^0.84.0
  "@react-native/jest-preset": ^0.85.0
  "@types/babel__core": ^7.20.0
  "@types/babel__helper-plugin-utils": ^7.0.0
  "@types/connect": ^3.4.36
  "@types/jest": ^29.2.1
  "@types/node": ^24.0.0
  "@types/qrcode": ^1.4.2
  "@types/react": ^19.0.0
  "@types/yargs": ^17.0.0
  "@yarnpkg/cli": ^4.6.0
  "@yarnpkg/core": ^4.2.0
  "@yarnpkg/fslib": ^3.1.1
  "@yarnpkg/types": ^4.0.0
  clipanion: ^4.0.0-rc.4
  enhanced-resolve: ^5.8.3
  esbuild: ^0.28.1
  eslint: ^9.0.0
  fast-xml-parser: ^5.3.4
  jest: ^29.2.1
  js-yaml: ^5.2.3
  markdown-table: ^3.0.0
  memfs: ^4.56.10
  metro-babel-transformer: ^0.84.0
  metro-source-map: ^0.84.0
  oxc-parser: ^0.134.0
  oxc-resolver: ^11.0.0
  oxfmt: ^0.72.0
  oxlint: ^1.87.0
  qrcode: ^1.5.0
  type-fest: ^4.0.0
  typescript: ^7.0.2
  yargs: ^17.0.0

catalogs:
  compat:
    typescript: ^6.0.0

compressionLevel: 0

dynamicPackageExtensions: ./scripts/dependencies.config.js

dynamicPackageOverrides:
  overrides:
    - id: nx

enableGlobalCache: false

enableScripts: false

enableTelemetry: false

externalWorkspacesOutputPath: .

globalFolder: .yarn/berry # Workaround for 'EXDEV: cross-device link not permitted' errors on GHA

logFilters:
  - code: YN0007 # X must be built because it never has been before or the last one failed
    level: discard
  - code: YN0008 # X must be rebuilt because its dependency tree changed
    level: discard
  - code: YN0013 # X can't be found in the cache and will be fetched from the remote registry
    level: discard
  - code: YN0069 # This rule seems redundant when applied on the original package
    level: error

nodeLinker: pnpm

npmMinimalAgeGate: 7d

npmRegistryServer: "https://registry.npmjs.org"

packageExtensions:
  "@fluentui/utilities@*":
    peerDependenciesMeta:
      # https://github.com/microsoft/fluentui/pull/30964
      "@types/react":
        optional: true
  "@react-native/jest-preset@0.85":
    dependencies:
      # @react-native/jest-preset fails to create mocks without `react-native`
      react-native: ^0.85.0
  babel-plugin-transform-flow-enums@*:
    peerDependencies:
      "@babel/core": ^7.20.0
  eslint-plugin-es-x@7.8:
    dependencies:
      typescript: ^6.0.0
  metro-config@0.83:
    dependencies:
      # `metro-config` fails to resolve `JsTransformerConfig` because it's in another package
      metro-transform-worker: ^0.83.1
  metro-config@0.84:
    dependencies:
      # `metro-config` fails to resolve `JsTransformerConfig` because it's in another package
      metro-transform-worker: ^0.84.0
  recast@*:
    dependencies:
      "@babel/parser": ^7.20.0

plugins:
  - path: .yarn/plugins/@yarnpkg/plugin-compat.cjs
    spec: "@yarnpkg/plugin-compat"
  - path: incubator/yarn-plugin-dynamic-extensions/index.js
  - path: incubator/yarn-plugin-dynamic-overrides/index.js
  - path: incubator/yarn-plugin-external-workspaces/dist/external-workspaces.cjs
  - path: incubator/yarn-plugin-ignore/dist/yarn-plugin-ignore.cjs
  - path: incubator/yarn-plugin-install-to/dist/yarn-plugin-install-to.cjs

tsEnableAutoTypes: false

yarnPath: .yarn/releases/yarn-4.18.1.cjs
