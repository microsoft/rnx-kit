name: Agent evals
on:
  # Runs the evals from the base branch with access to the pull request
  # number. Code from the pull request is never run; it is only read.
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
env:
  NODE_OPTIONS: "--disable-proto=delete"
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  audit:
    name: "Audit agent-assisted changes"
    permissions:
      contents: read
      pull-requests: write # comment on PRs
    runs-on: ubuntu-24.04
    steps:
      - name: Determine whether the pull request was assisted by an agent
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Copilot, Claude and Cursor, as authors of the pull request or its
          # commits, or as co-authors of its commits
          pattern='^login (Copilot|claude\[bot\]|cursor\[bot\])$|^email .*(\+Copilot@users\.noreply\.github\.com|noreply@anthropic\.com|cursoragent@cursor\.com)>?$'
          {
            echo "login ${PR_AUTHOR}"
            gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/commits" --jq '
              .[]
              | "login \(.author.login // "")",
                "email \(.commit.author.email)",
                (.commit.message | split("\n")[] | select(test("^co-authored-by:"; "i")) | "email \(.)")'
          } > "${RUNNER_TEMP}/identities.txt"
          if grep -qiE "${pattern}" "${RUNNER_TEMP}/identities.txt"; then
            echo 'assisted=true' >> "${GITHUB_OUTPUT}"
          fi
      - name: Checkout
        if: ${{ steps.detect.outputs.assisted == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
          fetch-depth: 0
          persist-credentials: false
      - name: Setup the toolchain
        if: ${{ steps.detect.outputs.assisted == 'true' }}
        uses: microsoft/react-native-test-app/.github/actions/setup-toolchain@6046bdd4914c7ceb35ec83b92ae3211a03ddccef # 5.4.14
        with:
          node-version: 24
      - name: Install npm dependencies
        if: ${{ steps.detect.outputs.assisted == 'true' }}
        run: |
          yarn
      - name: Audit the pull request
        if: ${{ steps.detect.outputs.assisted == 'true' }}
        env:
          AGENT_EVALS_REPORT: ${{ runner.temp }}/agent-evals.txt
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        # Only reports; failed rules do not fail the check
        run: |
          yarn workspace @rnx-kit/evals eval --var "pullRequest=${PR_NUMBER}" || true
      - name: Report results
        if: ${{ steps.detect.outputs.assisted == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPORT: ${{ runner.temp }}/agent-evals.txt
        run: |
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          {
            echo '### Agent evals'
            echo
            if [[ -s "${REPORT}" ]]; then
              echo '```'
              cat "${REPORT}"
              echo '```'
            else
              echo "The audit did not produce a report; see the [workflow run](${run_url})."
            fi
            if [[ ! -s "${REPORT}" ]] || grep -qE '^[-!] |^ +Execution failed: ' "${REPORT}"; then
              echo
              echo 'Rules marked `-` need the session log, and rules marked `!` or that failed with `Execution failed` could not be checked, e.g. because the grader needs Copilot access. Neither is available to this workflow. To audit them, run the following in `evals/` on the base branch:'
              echo
              echo "- Copilot cloud agent: \`yarn eval --var pullRequest=${PR_NUMBER}\`"
              echo '- Copilot CLI: `yarn eval --var copilotSession=<id>`, on the machine that ran the session'
            fi
            echo
            echo "<sub>[Workflow run](${run_url}) · This check only reports and never fails.</sub>"
          } > "${RUNNER_TEMP}/comment.md"
          cat "${RUNNER_TEMP}/comment.md" >> "${GITHUB_STEP_SUMMARY}"
          gh pr comment "${PR_NUMBER}" --repo "${GITHUB_REPOSITORY}" --body-file "${RUNNER_TEMP}/comment.md" --edit-last --create-if-none
    timeout-minutes: 30
