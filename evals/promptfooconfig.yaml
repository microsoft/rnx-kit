# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: rnx-kit session audit
prompts:
  - "{{session}}"
providers:
  # Replays a Copilot session from its event log in `$COPILOT_HOME` (default:
  # `~/.copilot`) and compares the session's checkout with the commit the
  # session started from. Looks up modified issues and pull requests with `gh`.
  - id: file://src/harness/provider.ts
    label: copilot-session
defaultTest:
  vars:
    # ID of the session to audit, e.g. `--var session=<id>`. If empty, audits
    # the most recently updated session in this repository that is not in use.
    session: ""
  options:
    # Grades `llm-rubric` assertions with Copilot; requires a GitHub token
    # with Copilot access in `COPILOT_GITHUB_TOKEN`, `GH_TOKEN` or
    # `GITHUB_TOKEN`, or a `gh auth login` session. Pass `--grader` to use
    # another provider instead.
    provider: file://src/harness/grader.ts
tests: file://tests/*.yaml
