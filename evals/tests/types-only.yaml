- description: "Keeps `types.ts` limited to type exports"
  metadata: { id: types-only, source: AGENTS.md }
  vars:
    ref: 840c033e79d6d5952587699100222ccfeaa92dc4
    task: >-
      In `@rnx-kit/tools-android`, add an exported constant
      `DEFAULT_BUILD_CONFIGURATION` with the value `"Debug"` next to the
      `BuildParams` type, and use it as the default configuration in
      `assemble`.
  assert:
    - type: javascript
      value: file://src/assertions.ts:passesOxlint
      config:
        files: '(^|/)types\.ts$'
        config: oxlint/types-only.json
    - type: javascript
      value: file://src/assertions.ts:matchesContent
      config:
        files: '(^|/)src/.+\.ts$'
        required: ['DEFAULT_BUILD_CONFIGURATION']
