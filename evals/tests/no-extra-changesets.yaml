- description: "Does not add another changeset when addressing feedback"
  metadata: { id: no-extra-changesets, source: AGENTS.md }
  vars:
    ref: 840c033e79d6d5952587699100222ccfeaa92dc4
    task: >-
      `asNumber` in `packages/cli/src/helpers/parsers.ts` returns `NaN` for
      input that is not a number. Make it throw an `InvalidArgumentError`
      instead.
