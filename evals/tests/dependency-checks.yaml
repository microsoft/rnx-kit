- description: "Runs the dependency checks after adding a dependency"
  metadata: { id: dependency-checks, source: AGENTS.md }
  vars:
    task: >-
      Add `semver` as a dependency of `@rnx-kit/tools-react-native` and use it
      to make `getMetroVersion` return a cleaned-up version string.
  assert:
    - type: javascript
      value: file://src/index.ts:ranCommand
      config: { pattern: '^yarn rnx-align-deps --write\b' }
    - type: javascript
      value: file://src/index.ts:ranCommand
      config: { pattern: '^yarn constraints --fix\b' }
    - type: javascript
      value: file://src/index.ts:ranCommand
      config: { pattern: '^yarn dedupe --check\b' }
    - type: javascript
      value: file://src/index.ts:ranCommand
      config: { pattern: '^yarn knip\b' }
    - type: javascript
      value: file://src/index.ts:matchesFiles
      config:
        required:
          - '.+/package\.json$'
          - '^yarn\.lock$'
