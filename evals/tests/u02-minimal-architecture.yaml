        required: ['\b(readPackage|resolveFrom|findPackageDependencyDir)\(']
        forbidden: ['readFileSync\(', 'JSON\.parse\(']
    - type: llm-rubric
      transform: file://src/transforms.ts:forGrader
      value: >-
        The implementation reuses existing helpers (such as `resolveFrom` and
        `readPackage`) instead of reimplementing package resolution or
        manifest parsing. It does not redesign or refactor shared internals,
