- description: "Runs a single test file with `yarn test <file>` from the package directory"
  metadata: { id: single-test-file, source: AGENTS.md }
  vars:
    task: Run only the tests in `packages/tools-node/test/path.test.ts`.
  assert:
    - type: javascript
      value: file://src/index.ts:ranCommand
      config:
        pattern: '^yarn test (\./)?test/path\.test\.ts$'
        inPackage: true
    - type: javascript
      value: file://src/index.ts:didNotRunCommand
      config: { pattern: '^node\b.*\s--test\b' }
    - type: javascript
      value: file://src/index.ts:matchesFiles
      config: { forbidden: ['.'] }
