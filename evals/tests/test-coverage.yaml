- description: "Passes the test glob explicitly when collecting coverage"
  metadata: { id: test-coverage, source: AGENTS.md }
  vars:
    task: What is the test coverage of `@rnx-kit/align-deps`?
  assert:
    - type: javascript
      value: file://src/index.ts:ranCommand
      config:
        pattern: '^yarn test(?=.*\s--coverage\b)(?=.*\stest/\S*\*)'
        inPackage: true
    - type: javascript
      value: file://src/index.ts:matchesFiles
      config: { forbidden: ['.'] }
