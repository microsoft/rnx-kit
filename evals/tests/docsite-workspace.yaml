- description: "Treats `docsite` as a separate Yarn workspace"
  metadata: { id: docsite-workspace, source: AGENTS.md }
  vars:
    task: Add `clsx` as a dependency of the documentation website.
  assert:
    - type: javascript
      value: file://src/index.ts:ranCommand
      config: { pattern: '^yarn\b', cwd: '^docsite$' }
    - type: javascript
      value: file://src/index.ts:matchesFiles
      config:
        required: ['^docsite/package\.json$', '^docsite/yarn\.lock$']
        forbidden: ['^package\.json$', '^yarn\.lock$']
