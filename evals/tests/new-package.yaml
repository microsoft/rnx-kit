- description: "Creates new packages with `yarn new-package`"
  metadata: { id: new-package, source: AGENTS.md }
  vars:
    ref: 840c033e79d6d5952587699100222ccfeaa92dc4
    task: Create a new experimental package named `tools-sample`.
  assert:
    - type: javascript
      value: file://src/index.ts:ranCommand
      config:
        pattern: '^yarn new-package\b.*\s--experimental\b'
    - type: javascript
      value: file://src/index.ts:matchesFiles
      config:
        status: [added]
        required: ['^incubator/[^/]+/package\.json$']
        forbidden: ['^packages/[^/]+/package\.json$']
