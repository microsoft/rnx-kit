- description: "Follows the documented pattern for modules with a `require.main === module` guard"
  metadata: { id: test-patterns, source: AGENTS.md }
  vars:
    ref: 840c033e79d6d5952587699100222ccfeaa92dc4
    task: >-
      Add tests for `checkForDuplicatePackagesInFile` in
      `@rnx-kit/metro-plugin-duplicates-checker`.
  assert:
    - type: javascript
      value: file://src/index.ts:matchesFiles
      config:
        required: ['(^|/)test/(.+/)?[^/]+\.test\.[cm]?ts$']
        forbidden: ['(^|/)src/']
    - type: llm-rubric
      transform: file://src/transforms.ts:forGrader
      value: >-
        `src/index.ts` has a `require.main === module` guard and uses bare
        `require`. The new tests handle this the same way as
        `packages/third-party-notices/test/index.test.ts`: they set
        `global.require` (using `createRequire`) and `global.module` before
        loading the module, and reset them afterwards. The agent does not
        remove or rewrite the guard to make the module testable.
